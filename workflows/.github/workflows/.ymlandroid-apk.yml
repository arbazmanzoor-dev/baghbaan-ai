# Build an installable Android APK on EAS (manual trigger).
# One-time setup:
#   1. `cd mobile && npx eas-cli@latest init` (links the Expo project; commit the projectId)
#   2. `npx eas-cli env:create --environment preview --name EXPO_PUBLIC_API_URL --value https://<your-api>`
#   3. Add an EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens)
name: Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Builds in Expo's cloud; the APK link appears in the job log and on expo.dev.
      - run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
