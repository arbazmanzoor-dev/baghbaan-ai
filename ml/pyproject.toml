[project]
name = "baghbaan-ml"
version = "0.1.0"
description = "BaghBaan AI — apple leaf disease data pipeline, training, evaluation, Grad-CAM and export"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tensorflow==2.21.0",
  "tensorflow-datasets==4.9.10",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.2",
  "pillow==13.0.0",
  "scipy==1.18.1",
]

[dependency-groups]
dev = [
  "ruff==0.17.3",
  "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baghbaan_ml"]

[tool.ruff]
extend = "../ruff.toml"
